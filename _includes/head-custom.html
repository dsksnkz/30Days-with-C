<!-- Dark theme override for the 30Days-with-C GitHub Pages site.
     Loaded after the theme stylesheet so these colors take precedence. -->
<style>
  html { color-scheme: dark; }
  .markdown-body {
    background-color: #0d1117 !important;
    color: #c9d1d9 !important;
  }
  .markdown-body a { color: #58a6ff !important; }
  .markdown-body a:hover { color: #79c0ff !important; text-decoration: underline; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4,
  .markdown-body h5, .markdown-body h6 { color: #c9d1d9 !important; }
  .markdown-body strong, .markdown-body em { color: #c9d1d9 !important; }
  .markdown-body code { color: #c9d1d9 !important; background-color: #161b22 !important; }
  .markdown-body pre { background-color: #161b22 !important; border-color: #30363d !important; }
  .markdown-body pre > code { background-color: transparent !important; color: #c9d1d9 !important; }
  .markdown-body .highlight pre { background-color: #161b22 !important; }
  .markdown-body hr, .markdown-body .rule { border-color: #30363d !important; }
  .markdown-body table { border-color: #30363d !important; }
  .markdown-body th { background-color: #161b22 !important; color: #c9d1d9 !important; border-color: #30363d !important; }
  .markdown-body td { border-color: #30363d !important; color: #c9d1d9 !important; }
  .markdown-body blockquote { border-left-color: #30363d !important; color: #8b949e !important; }
  .markdown-body blockquote > p { color: #c9d1d9 !important; }
  .markdown-body input, .markdown-body select, .markdown-body textarea {
    background-color: #161b22 !important; color: #c9d1d9 !important; border-color: #30363d !important;
  }
  .markdown-body .anchor { color: #8b949e !important; }
</style>
