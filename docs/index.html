<script type="application/json" id="docs">{"readme": "# 30 Days with C\n\nA 30-day C course, built to work with no AI help. Plan on 1\u20132 hours a day.\n\n**Progress:** not started. **Next up: Day 1.**\n\n## Where to go\n\n| File | What it's for |\n|---|---|\n| [SETUP.md](SETUP.md) | Start here: install a C compiler on Windows, macOS or Linux |\n| [WEEK1.md](WEEK1.md) | Full lessons for Days 1\u20137 |\n| [ROADMAP.md](ROADMAP.md) | Goals, key ideas and exercises for Days 8\u201330 |\n| [ERRORS.md](ERRORS.md) | What common compiler errors and crashes mean |\n| [ONLINE.md](ONLINE.md) | Running C in a browser |\n| [prompt.md](prompt.md) | A tutor prompt that gives hints, never answers |\n| [my-code/](my-code/) | The code you write, one folder per day |\n\n## Why C\n\nC is small, fast and close to the machine. Linux, Windows, Python and most other languages are built on it. It doesn't protect you from mistakes, so you'll learn how memory really works. That makes every other language easier afterwards.\n\n## Getting stuck without AI\n\nWork through these in order:\n\n1. **Read the first error.** Note the file, line and column, like `hello.c:5:12: error: ...`. Fix only that one, then compile again.\n2. **Look it up** in [ERRORS.md](ERRORS.md).\n3. **Check the line above too.** A missing `;` or `}` is often reported one line late.\n4. **Read the warnings.** Always compile with `-Wall -Wextra`. In C, a warning is often a real bug.\n5. **Use `printf`** to print your variables and see what they really hold.\n6. **Search the message**, for example `C error: expected ';' before`. Good sources are [cppreference](https://en.cppreference.com/w/c) and Stack Overflow.\n7. **Still stuck after 20 minutes?** Write down the problem, move on, and bring it back later.\n\n## Starting each day\n\n```bash\ncd my-code\nmkdir Day01\ncd Day01\n```\n\nWrite `lesson.c` in your editor, then compile and run it:\n\n```bash\ngcc lesson.c -o lesson -Wall -Wextra\n./lesson\n```\n\nThese commands work in Windows PowerShell, macOS and Linux. On Windows, the program is called `lesson.exe`, and `.\\lesson` runs it.\n\nCompile again every time you change the code. Running the old program shows the old behaviour.\n\n## The daily routine\n\n1. **Learn (20\u201330 min):** read the lesson and run the examples.\n2. **Build (45\u201360 min):** do the exercise without copying.\n3. **Test:** run every test value, especially the boundaries.\n4. **Break it (10 min):** change something, read the error, and fix it.\n5. **Answer the check-yourself questions** from memory.\n\n## Saving your work\n\nFrom the repo folder:\n\n```bash\ngit add .\ngit commit -m \"Finish Day 1\"\ngit push\n```\n\nTo get this repo on another computer:\n\n```bash\ngit clone https://github.com/dsksnkz/30Days-with-C\n```\n\n## The plan\n\n| Week | Topic | Project |\n|---|---|---|\n| 1 | Fundamentals | Console quiz game |\n| 2 | Pointers, structs and memory | Library management system |\n| 3 | Files and data structures | Expense tracker that saves its data |\n| 4 | Professional tools: debugging, build systems, testing, networking | Tiny web server |\n| Days 28\u201330 | Putting it all together | Task manager with a web interface |\n", "setup": "# Setup\n\nYou need a **C compiler** and an editor. This course uses **GCC** (or Clang, which accepts the same commands), so every system runs the same commands.\n\n## Windows\n\nUse **MSYS2**, which gives you GCC on Windows.\n\n1. Install it from [msys2.org](https://www.msys2.org/), or in Terminal run: `winget install MSYS2.MSYS2`\n2. Open **MSYS2 UCRT64** from the Start menu, and run:\n   ```bash\n   pacman -S mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gdb make\n   ```\n   Press Enter to accept the defaults.\n3. To use `gcc` from PowerShell or VS Code too, add `C:\\msys64\\ucrt64\\bin` to your PATH:\n   **Start \u2192 \"Edit environment variables for your account\" \u2192 Path \u2192 Edit \u2192 New**, paste the folder, then **OK**.\n4. **Close and reopen Terminal.**\n\nOn Windows, compiled programs end in `.exe`. Run them with `.\\hello` in PowerShell, or `./hello` in the MSYS2 shell.\n\n**Alternative:** if you already use **WSL** (Linux inside Windows), follow the Linux steps inside it. WSL is also the easiest way to do Days 25\u201330, which use networking features that work differently on Windows.\n\n## macOS\n\n```bash\nxcode-select --install\n```\n\nThis installs Clang. On macOS, `gcc` is really Clang, and that's fine: every command in this course works with it.\n\n## Linux\n\n| Distribution | Command |\n|---|---|\n| Ubuntu, Debian, Mint | `sudo apt install build-essential gdb valgrind` |\n| Fedora | `sudo dnf install gcc gdb make valgrind` |\n| Arch | `sudo pacman -S base-devel gdb valgrind` |\n\n## Check it worked\n\n```bash\ngcc --version\n```\n\nIf you see a version number, you're ready.\n\n## Pick an editor\n\n**VS Code** works on every system. Get it from [code.visualstudio.com](https://code.visualstudio.com/), then install the **C/C++** extension. Any editor is fine, though: Notepad++, Neovim, CLion or Code::Blocks all work.\n\nThis course compiles from a terminal, which works the same everywhere. VS Code has one built in: **View \u2192 Terminal**.\n\n## Your first program\n\nMake a folder, and create `hello.c` in it:\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C\\n\");\n    return 0;\n}\n```\n\nThen compile and run it:\n\n```bash\ngcc hello.c -o hello -Wall -Wextra\n./hello\n```\n\n`-o hello` names the program. `-Wall -Wextra` turns on warnings. Always use them.\n\n## Git (for saving your work)\n\n- **Windows:** `winget install Git.Git`, or download from [git-scm.com](https://git-scm.com/).\n- **macOS:** it comes with `xcode-select --install`.\n- **Linux:** install `git` with your package manager.\n\nNo compiler at all? See [ONLINE.md](ONLINE.md).\n", "week1": "# Week 1: Days 1\u20137\n\nDo [SETUP.md](SETUP.md) first.\n\nEvery program this week starts like this:\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    // your code goes here\n\n    return 0;\n}\n```\n\n- `#include <stdio.h>` brings in `printf` and the other input and output functions.\n- `main` is where the program starts. `return 0;` tells the system it finished without problems.\n- Every statement ends with `;`, and blocks go inside `{ }`.\n\nCompile with `gcc file.c -o file -Wall -Wextra`, then run `./file` (or `.\\file` in PowerShell).\n\n---\n\n# Day 1: Printing and variables\n\n**Goal:** a program that prints facts about you.\n\n## `printf`\n\n```c\nprintf(\"Hello\\n\");\nprintf(\"A\");\nprintf(\"B\\n\");     // AB, then a new line\n```\n\n`\\n` means new line. Without it, everything ends up on one line.\n\n## Variables\n\nIn C, you must give every variable a **type**:\n\n```c\nint age = 20;            // whole number\ndouble height = 1.75;    // decimal number\nchar initial = 'A';      // one character, in single quotes\n```\n\nThere's no built-in text type. You'll meet strings properly on Day 6.\n\n## Printing variables\n\n`printf` uses **format specifiers** as placeholders:\n\n```c\nprintf(\"Age: %d\\n\", age);\nprintf(\"Height: %f\\n\", height);      // 1.750000\nprintf(\"Height: %.2f\\n\", height);    // 1.75\nprintf(\"Initial: %c\\n\", initial);\nprintf(\"%c is %d\\n\", initial, age);  // several at once, in order\nprintf(\"Text: %s\\n\", \"hello\");       // a piece of text\n```\n\n| Specifier | Type |\n|---|---|\n| `%d` | `int` |\n| `%f` | `double` |\n| `%c` | `char` |\n| `%s` | text (a string) |\n| `%%` | a real `%` sign |\n\nUsing the wrong one, like `%d` for a `double`, prints rubbish. `-Wall` warns you about it.\n\n## Comments\n\n```c\n// one line\n/* several\n   lines */\n```\n\n## Exercise: about me\n\nMake variables for your age, your height in metres, and the first letter of your name. Print one line for each, with the height to 2 decimal places. Then print a sentence that uses all three.\n\n| Variables | Expected result |\n|---|---|\n| 20, 1.75, `'A'` | `A is 20 years old and 1.75 m tall.` |\n\n**Bonus:** print a box of `*` around your sentence, using `printf` for each line.\n\n## Check yourself\n\n1. What does `\\n` do?\n2. What specifier prints a `double` to 1 decimal place?\n3. What's the difference between `'A'` and `\"A\"`?\n4. What does `return 0;` mean at the end of `main`?\n\n---\n\n# Day 2: Input and maths\n\n**Goal:** a tip calculator.\n\n## Maths\n\n```c\nprintf(\"%d\\n\", 7 + 2);     // 9\nprintf(\"%d\\n\", 7 / 2);     // 3: int divided by int drops the decimal\nprintf(\"%d\\n\", 7 % 2);     // 1: the remainder\nprintf(\"%f\\n\", 7.0 / 2);   // 3.500000\n```\n\n**`7 / 2` is `3` in C.** If both sides are `int`, the decimal part is thrown away. Make one side a `double` to keep it:\n\n```c\nint a = 7;\nint b = 2;\ndouble result = (double)a / b;   // 3.5: the cast converts a first\n```\n\n`(int)4.9` gives `4`. A cast cuts off, it doesn't round.\n\n## Reading input with `scanf`\n\n```c\nint age;\nprintf(\"Age? \");\nscanf(\"%d\", &age);\n\ndouble price;\nprintf(\"Price? \");\nscanf(\"%lf\", &price);\n```\n\n- Use `%d` for `int`, and **`%lf`** for `double` (with `scanf` only, `printf` uses `%f`).\n- The **`&`** is required. It gives `scanf` the address of the variable, so it can store the number there. You'll understand why on Day 8. For now: forgetting `&` usually crashes the program.\n- Typing `abc` for a number leaves the variable unchanged. You'll handle that on Day 4.\n\n## Short forms\n\n```c\ntotal = total + 5;   // same as:\ntotal += 5;\n\ncount = count + 1;   // same as:\ncount++;\n```\n\n## Exercise: tip calculator\n\nAsk for the bill amount, the tip percentage and the number of people. Print the tip, the total and what each person pays, all to 2 decimal places.\n\n| Bill | Tip % | People | Tip | Total | Each |\n|---|---|---|---|---|---|\n| 100 | 10 | 2 | 10.00 | 110.00 | 55.00 |\n| 50 | 15 | 3 | 7.50 | 57.50 | 19.17 |\n| 80 | 0 | 1 | 0.00 | 80.00 | 80.00 |\n\n**Watch out:** if the tip percentage is an `int`, `15 / 100` is `0`. Make it a `double`.\n\n**Bonus:** try 0 people. What prints? Look up `inf` in C.\n\n## Check yourself\n\n1. What does `7 / 2` give in C, and why?\n2. What specifier does `scanf` need for a `double`?\n3. What is the `&` in `scanf(\"%d\", &age)` for?\n4. What does `(int)9.99` give?\n\n---\n\n# Day 3: Decisions\n\n**Goal:** a grade calculator.\n\n## `if`, `else if`, `else`\n\n```c\nif (score >= 90)\n{\n    printf(\"A\\n\");\n}\nelse if (score >= 80)\n{\n    printf(\"B\\n\");\n}\nelse\n{\n    printf(\"Keep going\\n\");\n}\n```\n\nThe **first match wins**, so put the largest check first. Never put `;` straight after `if (...)`: `if (x > 3);` ends the `if` right there.\n\n## Comparisons and logic\n\n```c\nx == 5      // equal (= assigns, == compares)\nx != 5      // not equal\nx >= 5      // also <, >, <=\nage >= 13 && age <= 19   // and\nday == 6 || day == 7     // or\n!finished                // not\n```\n\nC has no `true` or `false` by default: `0` means false, and anything else means true. For proper `bool`, add `#include <stdbool.h>`.\n\n**`if (x = 5)` compiles**, but assigns 5 and is always true. `-Wall` warns you about it.\n\n## `switch`\n\n```c\nswitch (choice)\n{\n    case 1:\n        printf(\"Start\\n\");\n        break;\n    case 2:\n    case 3:\n        printf(\"Stop\\n\");\n        break;\n    default:\n        printf(\"Unknown\\n\");\n}\n```\n\n`switch` works on whole numbers and `char`s, not on text. **Forgetting `break` runs the next case too.** That's called fall-through.\n\n## Exercise: grade calculator\n\nAsk for a score from 0 to 100 and print the grade: 90+ is `A`, 80+ is `B`, 70+ is `C`, 60+ is `D`, and anything lower is `F`. Print `Invalid` for anything below 0 or above 100.\n\n| Input | Expected result |\n|---|---|\n| 95 | A |\n| 90 | A |\n| 89 | B |\n| 60 | D |\n| 59 | F |\n| 0 | F |\n| 101 | Invalid |\n| -5 | Invalid |\n\n**Bonus:** a menu. Print `1. Add  2. Subtract  3. Quit`, read a number, and use `switch` to say what was picked. Remove one `break` and see what changes.\n\n## Check yourself\n\n1. What does C treat as false?\n2. Why does `if (x = 5)` always run?\n3. What happens if you forget `break` in a `switch`?\n4. Why must `>= 90` come before `>= 80`?\n\n---\n\n# Day 4: Loops\n\n**Goal:** a number guessing game.\n\n## `for`: when you know how many times\n\n```c\nfor (int i = 1; i <= 5; i++)\n{\n    printf(\"%d\\n\", i);\n}\n```\n\nThis prints 1 to 5. The three parts are the start, the check that keeps it going, and the step after each run.\n\n## `while`: until something changes\n\n```c\nint lives = 3;\n\nwhile (lives > 0)\n{\n    printf(\"Lives: %d\\n\", lives);\n    lives--;\n}\n```\n\nIf you forget `lives--`, it never ends. Press **Ctrl+C** to stop it.\n\n## `do`/`while`: run at least once\n\n```c\nint answer;\n\ndo\n{\n    printf(\"Type 1 to continue: \");\n    scanf(\"%d\", &answer);\n} while (answer != 1);\n```\n\n## `break` and `continue`\n\n```c\nfor (int i = 1; i <= 10; i++)\n{\n    if (i == 3)\n    {\n        continue;   // skip to 4\n    }\n    if (i == 6)\n    {\n        break;      // leave the loop\n    }\n    printf(\"%d \", i);   // 1 2 4 5\n}\n```\n\n## Random numbers\n\n```c\n#include <stdlib.h>\n#include <time.h>\n\nsrand(time(NULL));             // once, at the start of main\nint secret = rand() % 100 + 1; // 1 to 100\n```\n\n`rand() % 100` gives 0 to 99, so `+ 1` makes it 1 to 100. Without `srand(time(NULL))`, you get the same \"random\" numbers every run.\n\n## Checking that input worked\n\n`scanf` returns how many values it read. If someone types `abc`, it returns 0, and the bad text stays waiting, so a loop asking again would spin forever. This clears it:\n\n```c\nif (scanf(\"%d\", &guess) != 1)\n{\n    while (getchar() != '\\n') { }   // throw away the rest of the line\n    printf(\"Numbers only\\n\");\n    continue;\n}\n```\n\n## Exercise: number guessing game\n\n1. Pick a secret number from 1 to 100.\n2. Keep asking for a guess until the player gets it.\n3. After each wrong guess, print `Too high` or `Too low`.\n4. Count the guesses, and print the total when the player wins.\n\nWhile testing, print `secret` at the start, and remove that line when you're done.\n\n| Secret | Input | Expected result |\n|---|---|---|\n| 50 | 75 | Too high |\n| 50 | 25 | Too low |\n| 50 | 50 | You win, 3 guesses |\n| 50 | abc | Numbers only, and the game carries on |\n\n**Bonus 1:** give the player only 7 guesses, then reveal the number.\n\n**Bonus 2:** ask `Play again? (1/0)` at the end, using `do`/`while` around the whole game.\n\n## Check yourself\n\n1. When would you pick `while` over `for`?\n2. What range does `rand() % 6 + 1` give?\n3. Why do you need `srand(time(NULL))`?\n4. What does `scanf` return if the user types letters for `%d`?\n\n---\n\n# Day 5: Functions\n\n**Goal:** split your code into reusable, named pieces.\n\n## Writing a function\n\n```c\n#include <stdio.h>\n\nint add(int a, int b);     // prototype: tells the compiler it exists\nvoid greet(void);\n\nint main(void)\n{\n    greet();\n    int total = add(2, 3);\n    printf(\"%d\\n\", total);\n    return 0;\n}\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\nvoid greet(void)\n{\n    printf(\"Hi\\n\");\n}\n```\n\n- **Return type:** `void` returns nothing, and `int` promises to return an `int`.\n- **Prototypes:** C reads top to bottom. If a function is defined below `main`, put its prototype (the first line plus `;`) above `main`. Without it, you get `implicit declaration of function`.\n- `(void)` means the function takes no parameters.\n\n## Arguments are copies\n\n```c\nvoid double_it(int n)\n{\n    n = n * 2;    // changes the copy only\n}\n```\n\nCalling `double_it(x)` doesn't change `x`. To change the caller's variable you need a pointer, which is Day 8. For now, return the new value instead.\n\n## Scope\n\nA variable made inside a function or a `{ }` block only exists there. Two functions can each have their own `count` without clashing.\n\n## Exercise: calculator\n\nWrite `add`, `subtract`, `multiply` and `divide`, each taking two `double`s and returning a `double`. Write `read_number(const char *prompt)`, which prints the prompt and returns the `double` the user types. (`const char *` is how C passes text. You'll learn why on Day 9.)\n\nThen ask for two numbers and an operator, read it with `scanf(\" %c\", &op)`, use a `switch` to pick the function, and print the result to 2 decimal places.\n\nThe space before `%c` matters. It skips the Enter key still waiting from the last `scanf`.\n\n| Input | Expected result |\n|---|---|\n| 6, +, 3 | 9.00 |\n| 6, -, 3 | 3.00 |\n| 6, *, 3 | 18.00 |\n| 7, /, 2 | 3.50 |\n| 6, /, 0 | See bonus |\n\n**Bonus:** print a clear error instead of dividing by 0.\n\n## Check yourself\n\n1. Why do you need a prototype for a function defined below `main`?\n2. Why doesn't `double_it(x)` change `x`?\n3. What happens to code after `return` in the same block?\n4. Why put a space in `scanf(\" %c\", &op)`?\n\n---\n\n# Day 6: Arrays and strings\n\n**Goal:** work with lists of values and text.\n\n## Arrays\n\n```c\nint scores[3] = {90, 75, 60};\n\nprintf(\"%d\\n\", scores[0]);   // 90: counting starts at 0\nscores[1] = 80;\n\nint count = sizeof(scores) / sizeof(scores[0]);   // 3\n\nfor (int i = 0; i < count; i++)\n{\n    printf(\"%d\\n\", scores[i]);\n}\n```\n\nAn array's size is fixed. **C doesn't check the index.** `scores[3]` here reads whatever happens to be next in memory, or crashes. It's your job to stay inside `0` to `count - 1`.\n\n## Strings\n\nA string is an array of `char` that ends with a hidden **`'\\0'`** character, which marks the end.\n\n```c\n#include <string.h>\n\nchar name[] = \"Alex\";     // 5 chars: A l e x \\0\nprintf(\"%s\\n\", name);\nprintf(\"%zu\\n\", strlen(name));   // 4: doesn't count the \\0\nprintf(\"%c\\n\", name[0]);         // A\n```\n\nYou can't use `=` or `==` on strings:\n\n```c\nchar copy[20];\nstrcpy(copy, name);              // copy into it\nif (strcmp(name, \"Alex\") == 0)   // 0 means equal\n{\n    printf(\"Same\\n\");\n}\n```\n\n## Reading a line of text\n\n```c\nchar line[100];\nprintf(\"Sentence? \");\nfgets(line, sizeof(line), stdin);\nline[strcspn(line, \"\\n\")] = '\\0';   // remove the Enter at the end\n```\n\n`fgets` keeps the `\\n` from the Enter key, so the next line removes it. Don't use `scanf(\"%s\")` for text: it stops at the first space.\n\n**Mixing `scanf` and `fgets`:** `scanf(\"%d\")` leaves the Enter behind, and the next `fgets` reads that empty line straight away. After a `scanf`, clear the line with `while (getchar() != '\\n') { }`.\n\n## Characters\n\n```c\n#include <ctype.h>\n\ntolower('A');    // 'a'\ntoupper('b');    // 'B'\nisalpha('7');    // 0: not a letter\nisdigit('7');    // non-zero: a digit\nisspace(' ');    // non-zero: a space\n```\n\n## Exercise: text analyzer\n\nRead a sentence with `fgets`, then print:\n1. The number of characters.\n2. The number of words. Count each place where a non-space character follows a space or the start.\n3. The number of vowels (a, e, i, o, u), counting capitals too.\n4. The sentence reversed, with a `for` loop counting down.\n\n| Input | Characters | Words | Vowels | Reversed |\n|---|---|---|---|---|\n| `Hello World` | 11 | 2 | 3 | `dlroW olleH` |\n| `C is fun` | 8 | 3 | 2 | `nuf si C` |\n\n**Bonus:** say whether the input is a palindrome, ignoring capitals. `Level` should say yes.\n\n## Check yourself\n\n1. What's the index of the last item in an array of 10?\n2. What is `'\\0'` for?\n3. Why can't you compare strings with `==`?\n4. Why does `fgets` need the `strcspn` line after it?\n\n---\n\n# Day 7: Project: console quiz game\n\nNo new topics today. You're combining everything, without a walkthrough.\n\n## Requirements\n\n1. Ask for the player's name with `fgets`, and remove the `\\n`.\n2. Store at least 5 questions and their answers in two arrays of strings, at matching positions:\n   ```c\n   const char *questions[] = {\"Capital of France?\", \"2 + 2?\"};\n   ```\n3. Loop through the questions and ask each one.\n4. Compare answers while ignoring capitals. Write your own `same_ignoring_case` function, using `tolower`.\n5. Say whether each answer was right, and show the correct one if not.\n6. At the end, print the score and percentage to 1 decimal place.\n7. Print a rank: 100% is `Perfect`, 60% or above is `Passed`, and anything else is `Try again`.\n8. Use at least 2 functions of your own, such as `ask_question` and `print_rank`.\n\n## Watch out\n\n- `score / total * 100` with two `int`s gives 0 for most scores. Use `(double)score / total * 100`.\n- An answer buffer like `char answer[100]` must be big enough for anything the player might type.\n\n## Test it\n\n| Scenario (5 questions) | Expected result |\n|---|---|\n| All correct | 100.0%, Perfect |\n| 3 correct | 60.0%, Passed |\n| 2 correct | 40.0%, Try again |\n| All wrong | 0.0%, Try again |\n| Answer typed as `PARIS` when correct is `Paris` | Counts as correct |\n\n## Bonus\n\n- Also ignore spaces at the start and end of the answer. Write a `trim` function.\n- Ask whether to play again.\n\n**Well done: that's Week 1.**\n", "roadmap": "# Roadmap: Days 8\u201330\n\nEach day lists what to learn, the main ideas, and what to build. Look the topics up on [cppreference](https://en.cppreference.com/w/c) or in a good book like *C Programming: A Modern Approach* (K. N. King). Searching `C <topic name>` also works well.\n\nKeep compiling with `-Wall -Wextra`. From Day 11, add `-g -fsanitize=address,undefined` while testing: it catches memory bugs the moment they happen. (On Windows with MSYS2, sanitizers aren't available. Use WSL for them, or rely on careful testing.)\n\n## Week 2: Pointers, structs and memory\n\n**Day 8: Pointers.** A pointer holds the address of another variable. Learn `&` (address of), `*` (the value at an address), and `NULL`. This is why `scanf` needs `&`.\n```c\nint x = 5;\nint *p = &x;\n*p = 10;        // x is now 10\n```\n**Build:** a `swap(int *a, int *b)` function that really swaps two variables, and `min_max(int arr[], int n, int *min, int *max)`, which hands back two answers through pointers.\n\n**Day 9: Pointers and arrays.** An array name becomes a pointer to its first item. Learn pointer arithmetic (`p + 1`), why functions need the length passed with an array, `const`, and why strings are `char *`.\n**Build:** your own `my_strlen`, `my_strcpy` and `my_strcmp` using pointers only, no `[ ]`. Compare their results with the real ones.\n\n**Day 10: Structs.** Group related data into one type. Learn `struct`, `typedef`, the `.` and `->` operators, and arrays of structs.\n```c\ntypedef struct\n{\n    char title[100];\n    int year;\n} Book;\n```\n**Build:** an array of 5 `Book`s. Print them all, find the oldest, and sort them by year with a simple loop.\n\n**Day 11: Dynamic memory.** Learn the stack vs. the heap, `malloc`, `calloc`, `realloc` and `free`, and always checking for `NULL`. Every `malloc` needs exactly one `free`.\n**Build:** ask how many numbers to store, `malloc` exactly that much, fill it, print the average, and `free` it. Run it with `-fsanitize=address`, or `valgrind ./program` on Linux, to prove nothing leaks.\n\n**Day 12: Strings, safely.** Learn `strncpy`, `snprintf`, `strtok`, `strtol` and `strstr`. Learn what a **buffer overflow** is and why `gets` was removed from C.\n**Build:** a `read_int(const char *prompt)` function using `fgets` and `strtol`, which keeps asking until it gets a valid number in range. You'll use it in every project from now on.\n\n**Day 13: Multi-file programs and Make.** Split code into `.c` and `.h` files. Learn header guards, `static` functions, and compiling several files together. Write a `Makefile` so `make` builds everything.\n**Build:** move your `Book` code into `book.h` and `book.c`, keep `main` in `main.c`, and build it with `make`.\n\n**Day 14: Project: library management system.** A `Book` struct (title, author, borrowed or not) and a `Library` that holds a dynamic array of them, growing with `realloc`. Support adding, borrowing, returning, listing and searching. A book that's already borrowed can't be borrowed again. Use a menu loop and `read_int`, and make sure there are no leaks.\n\n## Week 3: Files and data structures\n\n**Day 15: File I/O.** Learn `fopen`, `fclose`, `fprintf`, `fscanf`, `fgets` on files, the modes `\"r\"`, `\"w\"` and `\"a\"`, and checking for `NULL` when a file is missing.\n**Build:** a journal that adds a dated line to `journal.txt` each run, and can print every entry. Use `time` and `strftime` for the date.\n\n**Day 16: Linked lists.** Each node holds data and a pointer to the next one. Learn insert at the front, insert at the end, delete, search, and freeing the whole list.\n**Build:** a to-do list as a linked list with add, remove by number, and list. Check it for leaks.\n\n**Day 17: Enums, unions and bits.** Learn `enum`, `union`, `switch` over an enum, and the bit operators `&`, `|`, `^`, `~`, `<<` and `>>`.\n**Build:** a permissions checker that stores read, write and run as bits in one `unsigned int`, with functions to set, clear and test each one.\n\n**Day 18: Function pointers and sorting.** A function pointer stores which function to call. Learn `qsort` with your own compare function, and `bsearch`.\n**Build:** sort an array of `Book`s by title, then by year, using `qsort` and two compare functions. Search for a title with `bsearch`.\n\n**Day 19: Hash tables.** Learn how a hash function turns a key into an index, and how to handle collisions with chaining.\n**Build:** a word counter: read a text file, count each word in your own hash table, and print the 10 most common.\n\n**Day 20: Binary files and command-line arguments.** Learn `int main(int argc, char *argv[])`, `fwrite` and `fread` for whole structs, and `\"rb\"` and `\"wb\"`.\n**Build:** `copy source.txt dest.txt`, your own file-copying tool. Print a usage message if the arguments are wrong.\n\n**Day 21: Project: expense tracker.** Add, list and delete expenses (date, category, amount), with totals per category. Save to a CSV file with `fprintf`, and load it on startup. Close the program, reopen it, and check that the data is still there. Handle a missing or broken file without crashing.\n\n## Week 4: Professional tools\n\n**Day 22: Debugging with GDB.** Compile with `-g`. Learn `break`, `run`, `next`, `step`, `print`, `backtrace` and `watch`. Find a segfault's exact line with `backtrace`. (On macOS, use `lldb`, whose commands are almost the same.)\n**Build:** take three buggy programs (write them yourself, or break old ones on purpose) and find each bug using only the debugger, no `printf`.\n\n**Day 23: Testing.** Learn `assert` from `<assert.h>`, how to write small test functions that return pass or fail, and testing edge cases: empty input, one item, the maximum size.\n**Build:** a `test.c` for your expense tracker's functions, with a `make test` target that runs it.\n\n**Day 24: CMake and libraries.** Learn `CMakeLists.txt`, `cmake -B build` and `cmake --build build`, which work on every system. Learn linking with `-l`, such as `-lm` for `<math.h>`.\n**Build:** convert the library system from Make to CMake, and add a function that uses `sqrt` from the maths library.\n\n**Day 25: SQLite.** Learn basic SQL (`SELECT`, `INSERT`, `UPDATE`, `DELETE`) and the SQLite C API: `sqlite3_open`, `sqlite3_prepare_v2`, `sqlite3_bind_*`, `sqlite3_step`. Always bind values, never paste them into the SQL text.\n**Build:** move the expense tracker from CSV to an SQLite database.\n\n**Day 26: Sockets.** Learn what TCP is, and `socket`, `bind`, `listen`, `accept`, `recv`, `send` and `close`. On Windows, use WSL for this week: native Windows sockets (Winsock) work differently.\n**Build:** an echo server that sends back whatever a client types. Test it with `nc localhost 8080` or `telnet`.\n\n**Day 27: Project: tiny web server.** Read an HTTP request, work out the path, and reply with a proper status line (`200 OK` or `404 Not Found`) and headers. Serve `.html` files from a folder. Open it in your browser at `http://localhost:8080`.\n\n## Final stretch: capstone\n\n**Day 28: Design.** Plan a task manager that stores tasks in SQLite and has a web interface from your Day 27 server. Split it into `db.c`, `http.c`, `tasks.c` and `main.c`, with headers and CMake.\n**Build:** the project structure, the database table, and the functions to add and list tasks.\n\n**Day 29: Finish the features.** Add creating, listing, completing and deleting tasks from the browser, plus input checks and clear errors. Test every function, and run it with sanitizers to check for leaks and overflows.\n\n**Day 30: Ship it.** Clean up the warnings, write a good README with build steps for Windows, macOS and Linux, and push it to GitHub.\n\n**That's the course. Well done!**\n", "errors": "# Common errors\n\nAn error looks like this: `hello.c:5:12: error: expected ';' before 'return'`. That's the file, line 5, column 12, and the message.\n\n**Fix the first error first.** One mistake can cause many errors further down. **Errors** stop the build. **Warnings** don't, but in C they're very often real bugs, so fix them too.\n\nC also has a third kind of problem: code that compiles and then **crashes or gives random results**. That's covered at the bottom.\n\n## Setup problems\n\n| Message | Fix |\n|---|---|\n| `'gcc' is not recognized` (Windows) | Add `C:\\msys64\\ucrt64\\bin` to PATH (see [SETUP.md](SETUP.md)), then reopen Terminal |\n| `gcc: command not found` (macOS, Linux) | Install the compiler. See [SETUP.md](SETUP.md) |\n| `./hello: No such file or directory` | It didn't compile, or you're in the wrong folder. Check for errors, then run `ls` |\n| `'.' is not recognized` (Windows cmd) | Use `hello` or `.\\hello` in cmd and PowerShell |\n| The old version still runs | You forgot to compile again after saving |\n\n## Compiler errors\n\n| Message | What it usually means | Fix |\n|---|---|---|\n| `expected ';' before ...` | Missing semicolon | Add `;` at the end of the line above |\n| `expected '}' at end of input` | A `{` was never closed | Match up your braces; indenting helps |\n| `'x' undeclared` | A typo, or it's out of scope | Check spelling, and that it's inside the right `{ }` |\n| `implicit declaration of function 'printf'` | A missing `#include` | Add `#include <stdio.h>` (or `<string.h>`, `<stdlib.h>`...) |\n| `implicit declaration of function 'add'` | Your function is defined below `main` | Add a prototype above `main` |\n| `redefinition of 'x'` | You declared the same variable twice | Remove the type from the second one |\n| `conflicting types for 'add'` | The prototype and the function don't match | Make them the same |\n| `too few arguments to function` | Calling it with the wrong number of arguments | Match the parameters |\n| `assignment to expression with array type` | `name = \"Alex\";` on a `char` array | Use `strcpy(name, \"Alex\");` |\n| `undefined reference to 'sqrt'` | A linker error: a library is missing | Add `-lm` at the end of the gcc command |\n| `undefined reference to 'main'` | No `main`, or a typo in it | Check for `int main(void)` |\n| `multiple definition of ...` | The same function is in two files | Put only prototypes in `.h` files |\n\n## Warnings to never ignore\n\n| Warning | Meaning |\n|---|---|\n| `format '%d' expects argument of type 'int', but argument has type 'double'` | Wrong `printf` or `scanf` specifier. See Day 1 |\n| `format '%d' expects argument of type 'int *'` | You forgot the `&` in `scanf` |\n| `suggest parentheses around assignment used as truth value` | `if (x = 5)`. You meant `==` |\n| `'x' is used uninitialized` | The variable holds random rubbish. Give it a value |\n| `control reaches end of non-void function` | A path through your function has no `return` |\n| `comparison of integer expressions of different signedness` | Comparing `int` with `size_t`. Usually harmless, but check for negative values |\n| `unused variable 'x'` | Often a scope mistake or a typo |\n\n## Crashes while running\n\n| Symptom | Common causes | How to find it |\n|---|---|---|\n| `Segmentation fault` | Using a `NULL` pointer, an index past the end of an array, a missing `&` in `scanf`, or using memory after `free` | Compile with `-g -fsanitize=address` and run again: it prints the exact line. Or use `gdb` (Day 22) |\n| `Floating point exception` | Dividing an `int` by 0 | Check before dividing |\n| `double free or corruption` | Calling `free` twice on the same pointer, or writing past the end of a `malloc` block | Set pointers to `NULL` after `free`, and check sizes |\n| `stack smashing detected` | Writing past the end of a local array, often a string | Use `fgets` and `snprintf` with `sizeof` |\n| Program waits forever | `scanf` is waiting for input, or an infinite loop | Press Ctrl+C. Check the loop condition |\n\n## Compiles but gives the wrong answer\n\n| Symptom | Likely cause |\n|---|---|\n| A decimal result comes out as 0 | `int / int`. Cast one side to `double` |\n| A number is huge or random | The variable was never given a value, or a wrong specifier |\n| `%f` prints 0.000000 for a number you read | You used `%f` instead of `%lf` in `scanf` |\n| A `switch` runs several cases | A missing `break` |\n| An `if` always runs | `=` instead of `==`, or a `;` straight after `if (...)` |\n| A loop never ends on bad input | `scanf` failed and the bad text is still waiting. See Day 4 |\n| `fgets` reads an empty line | A `scanf` left the Enter behind. See Day 6 |\n| String comparison never matches | You used `==`. Use `strcmp(a, b) == 0` |\n| String has a strange extra character | Missing `'\\0'`, or the `\\n` from `fgets` |\n| A loop runs one time too many | `<=` where you meant `<` |\n| A function doesn't change your variable | Arguments are copies. Pass a pointer (Day 8) |\n", "online": "# Running C online\n\nUse this when the computer doesn't have a compiler.\n\n## 1. Pick a site\n\n- [OnlineGDB](https://www.onlinegdb.com/online_c_compiler): lets you type input while it runs, and has a debugger.\n- [Programiz](https://www.programiz.com/c-programming/online-compiler/): simple, and it also waits for input.\n- [OneCompiler](https://onecompiler.com/c): you enter input before running.\n- [Compiler Explorer](https://godbolt.org/): shows the machine code your C becomes. Fun from Week 2 onwards.\n\n## 2. Paste your whole file\n\nInclude the `#include` lines and `main`, exactly as on your laptop.\n\n## 3. Typing input\n\nOn OneCompiler, your program can't stop and wait for you to type. Put your answers in the **STDIN** box before pressing Run, one per line:\n\n```\n20\n1.75\n```\n\nFor games like Day 4's guessing game, use OnlineGDB or Programiz, which wait for input.\n\n## Differences from your laptop\n\n| On your laptop | On these sites |\n|---|---|\n| You run `gcc` then the program | You press Run |\n| You choose the warnings with `-Wall -Wextra` | Some sites show fewer warnings |\n| Files you write stay on disk | Files may disappear when you close the tab |\n| You can use several `.c` files | Usually just one file |\n\nDays 1\u201312 work fine online. From Day 13, you need several files, libraries or networking, so use your laptop.\n\nRemember to copy your code somewhere before closing the tab, or it may be lost.\n"}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const docs = JSON.parse(document.getElementById("docs").textContent);
const main = document.getElementById("doc");
const repo = "https://github.com/dsksnkz/30Days-with-C/tree/main/";

function show(page) {
  if (!docs[page]) page = "readme";
  main.innerHTML = marked.parse(docs[page]);

  main.querySelectorAll("table").forEach(t => {
    const box = document.createElement("div");
    box.className = "table";
    t.replaceWith(box);
    box.append(t);
  });

  main.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    const md = href.match(/^([A-Za-z0-9]+)\.md$/);
    if (md && docs[md[1].toLowerCase()]) a.setAttribute("href", "#" + md[1].toLowerCase());
    else if (!/^(https?:|#)/.test(href)) a.setAttribute("href", repo + href);
  });

  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === "#" + page));
  scrollTo(0, 0);
}

addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
